name: Focus Windows Build

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the Windows build as a GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to create when publishing"
        required: false
        default: "v0.1.0"
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-windows
          path: |
            dist/*.exe
            dist/*.blockmap
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true
