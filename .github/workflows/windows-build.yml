name: Windows Build

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build application
        run: pyinstaller --clean packaging_skybrowse.spec
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = "dist/SkyBrowse/SkyBrowse.exe"
          if (!(Test-Path $exe)) { throw "Executable was not produced: $exe" }
          windeployqt --release --no-translations $exe
          if (!(Test-Path $exe)) { throw "Executable disappeared after deployment" }
      - name: Smoke test executable exists
        shell: pwsh
        run: if (!(Test-Path "dist/SkyBrowse/SkyBrowse.exe")) { exit 1 }
      - name: Archive build
        run: Compress-Archive -Path dist/SkyBrowse/* -DestinationPath SkyBrowse-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkyBrowse-windows
          path: SkyBrowse-windows.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SkyBrowse-windows.zip
          generate_release_notes: true
